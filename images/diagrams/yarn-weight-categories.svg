<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Yarn weight categories: 0–7</title><desc id="desc">The category describes a broad thickness group, not skein weight or yardage.</desc><style>.bg{fill:#fbf9f4}.card{fill:#fff;stroke:#d8d2c7;stroke-width:2}.dot{fill:#416e60}.num{font:700 17px system-ui,sans-serif;fill:#fff}.title{font:700 30px system-ui,sans-serif;fill:#313b34}.sub{font:18px system-ui,sans-serif;fill:#555}.label{font:700 18px system-ui,sans-serif;fill:#315f54}.detail{font:17px system-ui,sans-serif;fill:#292a27}.foot{font:15px system-ui,sans-serif;fill:#676}.rule{stroke:#d4a46b;stroke-width:4}</style><rect class="bg" width="960" height="500" rx="20"/><text x="40" y="62" class="title">Yarn weight categories: 0–7</text><text x="40" y="102" class="sub">The category describes a broad thickness group, not skein weight or yardage.</text><line x1="40" y1="130" x2="920" y2="130" class="rule"/><rect x="40" y="210" width="280" height="180" rx="18" class="card"/><circle cx="74" cy="248" r="16" class="dot"/><text x="74" y="254" text-anchor="middle" class="num">1</text><text x="100" y="255" class="label">0 · Lace</text><text x="62" y="305" class="detail">1 · Super Fine</text><text x="62" y="333" class="detail">2 · Fine</text><rect x="340" y="210" width="280" height="180" rx="18" class="card"/><circle cx="374" cy="248" r="16" class="dot"/><text x="374" y="254" text-anchor="middle" class="num">2</text><text x="400" y="255" class="label">3 · Light</text><text x="362" y="305" class="detail">4 · Medium</text><text x="362" y="333" class="detail">5 · Bulky</text><rect x="640" y="210" width="280" height="180" rx="18" class="card"/><circle cx="674" cy="248" r="16" class="dot"/><text x="674" y="254" text-anchor="middle" class="num">3</text><text x="700" y="255" class="label">6 · Super Bulky</text><text x="662" y="305" class="detail">7 · Jumbo</text><text x="662" y="333" class="detail">Check the pattern gauge</text><text x="40" y="450" class="foot">Category names follow the Craft Yarn Council. Hook and gauge ranges are guidelines.</text></svg>