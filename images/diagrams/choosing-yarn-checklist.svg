<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Choose yarn in this order</title><desc id="desc">A quick decision path for comparing a yarn with a specific project.</desc><style>.bg{fill:#fbf9f4}.card{fill:#fff;stroke:#d8d2c7;stroke-width:2}.dot{fill:#416e60}.num{font:700 17px system-ui,sans-serif;fill:#fff}.title{font:700 30px system-ui,sans-serif;fill:#313b34}.sub{font:18px system-ui,sans-serif;fill:#555}.label{font:700 18px system-ui,sans-serif;fill:#315f54}.detail{font:17px system-ui,sans-serif;fill:#292a27}.foot{font:15px system-ui,sans-serif;fill:#676}.rule{stroke:#d4a46b;stroke-width:4}</style><rect class="bg" width="960" height="500" rx="20"/><text x="40" y="62" class="title">Choose yarn in this order</text><text x="40" y="102" class="sub">A quick decision path for comparing a yarn with a specific project.</text><line x1="40" y1="130" x2="920" y2="130" class="rule"/><rect x="40" y="210" width="280" height="180" rx="18" class="card"/><circle cx="74" cy="248" r="16" class="dot"/><text x="74" y="254" text-anchor="middle" class="num">1</text><text x="100" y="255" class="label">Project needs</text><text x="62" y="305" class="detail">Read fiber, weight,</text><text x="62" y="333" class="detail">yardage and care</text><rect x="340" y="210" width="280" height="180" rx="18" class="card"/><circle cx="374" cy="248" r="16" class="dot"/><text x="374" y="254" text-anchor="middle" class="num">2</text><text x="400" y="255" class="label">Stitch visibility</text><text x="362" y="305" class="detail">Check whether you can</text><text x="362" y="333" class="detail">see the stitch tops</text><rect x="640" y="210" width="280" height="180" rx="18" class="card"/><circle cx="674" cy="248" r="16" class="dot"/><text x="674" y="254" text-anchor="middle" class="num">3</text><text x="700" y="255" class="label">Swatch</text><text x="662" y="305" class="detail">Compare gauge, feel</text><text x="662" y="333" class="detail">and fabric before use</text><text x="40" y="450" class="foot">A yarn category alone does not guarantee an interchangeable result.</text></svg>