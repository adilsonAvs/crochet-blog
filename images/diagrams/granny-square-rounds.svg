<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Classic granny-square construction: center ring, four corner spaces, then new clusters in those spaces."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bb7153"/></marker></defs><style>@media(max-width:520px){.stage-label{font-size:31px!important}.svg-heading{font-size:24px!important}}</style><rect width="800" height="600" rx="24" fill="#f7f4ed"/><text class="svg-heading" x="28" y="39" fill="#49534d" font-family="Arial,sans-serif" font-size="21" font-weight="700">VISUAL GUIDE</text><rect x="18" y="53" width="764" height="168" rx="18" fill="#fffdfa" stroke="#e4ded3" stroke-width="2"/><circle cx="48" cy="89" r="19" fill="#e5eee6"/><text x="48" y="95" text-anchor="middle" fill="#55796d" font-family="Arial,sans-serif" font-size="16" font-weight="700">1</text><text class="stage-label" x="78" y="88" fill="#49534d" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="78" dy="0">Begin with a</tspan><tspan x="78" dy="32">center ring</tspan></text><ellipse cx="392" cy="140" rx="40" ry="34" fill="none" stroke="#bb7153" stroke-width="7"/><text x="477" y="148" fill="#49534d" font-family="Arial" font-size="18">center ring</text><rect x="18" y="233" width="764" height="168" rx="18" fill="#fffdfa" stroke="#e4ded3" stroke-width="2"/><circle cx="48" cy="269" r="19" fill="#e5eee6"/><text x="48" y="275" text-anchor="middle" fill="#55796d" font-family="Arial,sans-serif" font-size="16" font-weight="700">2</text><text class="stage-label" x="78" y="268" fill="#49534d" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="78" dy="0">Build four</tspan><tspan x="78" dy="32">Round 1</tspan><tspan x="78" dy="32">corners</tspan></text><rect x="332" y="260" width="150" height="122" rx="22" fill="#fffdfa" stroke="#c9d3c8" stroke-width="5"/><path d="M340 273 q28 -26 55 0 M420 273 q28 -26 55 0 M340 369 q28 26 55 0 M420 369 q28 26 55 0" fill="none" stroke="#55796d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="407" cy="320" r="18" fill="#f4eee3" stroke="#bb7153" stroke-width="5"/><text x="537" y="325" fill="#49534d" font-family="Arial" font-size="18">4 corner spaces</text><rect x="18" y="413" width="764" height="168" rx="18" fill="#fffdfa" stroke="#e4ded3" stroke-width="2"/><circle cx="48" cy="449" r="19" fill="#e5eee6"/><text x="48" y="455" text-anchor="middle" fill="#55796d" font-family="Arial,sans-serif" font-size="16" font-weight="700">3</text><text class="stage-label" x="78" y="448" fill="#49534d" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="78" dy="0">Work Round 2</tspan><tspan x="78" dy="32">into corner</tspan><tspan x="78" dy="32">spaces</tspan></text><rect x="332" y="438" width="150" height="126" rx="30" fill="none" stroke="#55796d" stroke-width="7"/><rect x="296" y="418" width="222" height="166" rx="42" fill="none" stroke="#bb7153" stroke-width="5" stroke-dasharray="9 9"/><path d="M527 470 L592 470" fill="none" stroke="#bb7153" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="602" y="478" fill="#49534d" font-family="Arial" font-size="17">work in corners</text></svg>