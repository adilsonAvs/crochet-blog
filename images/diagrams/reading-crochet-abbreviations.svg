<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Decode a crochet pattern line</title><desc id="desc">Read the designer’s key before applying an abbreviation or repeat.</desc><style>.bg{fill:#fbf9f4}.card{fill:#fff;stroke:#d8d2c7;stroke-width:2}.dot{fill:#416e60}.num{font:700 17px system-ui,sans-serif;fill:#fff}.title{font:700 30px system-ui,sans-serif;fill:#313b34}.sub{font:18px system-ui,sans-serif;fill:#555}.label{font:700 18px system-ui,sans-serif;fill:#315f54}.detail{font:17px system-ui,sans-serif;fill:#292a27}.foot{font:15px system-ui,sans-serif;fill:#676}.rule{stroke:#d4a46b;stroke-width:4}</style><rect class="bg" width="960" height="500" rx="20"/><text x="40" y="62" class="title">Decode a crochet pattern line</text><text x="40" y="102" class="sub">Read the designer’s key before applying an abbreviation or repeat.</text><line x1="40" y1="130" x2="920" y2="130" class="rule"/><rect x="40" y="210" width="280" height="180" rx="18" class="card"/><circle cx="74" cy="248" r="16" class="dot"/><text x="74" y="254" text-anchor="middle" class="num">1</text><text x="100" y="255" class="label">1 · Find the key</text><text x="62" y="305" class="detail">Locate abbreviations</text><text x="62" y="333" class="detail">and special terms</text><rect x="340" y="210" width="280" height="180" rx="18" class="card"/><circle cx="374" cy="248" r="16" class="dot"/><text x="374" y="254" text-anchor="middle" class="num">2</text><text x="400" y="255" class="label">2 · Read punctuation</text><text x="362" y="305" class="detail">Follow the stated</text><text x="362" y="333" class="detail">repeat boundaries</text><rect x="640" y="210" width="280" height="180" rx="18" class="card"/><circle cx="674" cy="248" r="16" class="dot"/><text x="674" y="254" text-anchor="middle" class="num">3</text><text x="700" y="255" class="label">3 · Check the count</text><text x="662" y="305" class="detail">Compare the result</text><text x="662" y="333" class="detail">with the row total</text><text x="40" y="450" class="foot">Punctuation and special abbreviations can vary by pattern.</text></svg>