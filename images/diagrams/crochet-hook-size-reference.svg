<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Choose a hook by the pattern and gauge</title><desc id="desc">Hook labels are references; the fabric and pattern gauge guide the choice.</desc><style>.bg{fill:#fbf9f4}.card{fill:#fff;stroke:#d8d2c7;stroke-width:2}.dot{fill:#416e60}.num{font:700 17px system-ui,sans-serif;fill:#fff}.title{font:700 30px system-ui,sans-serif;fill:#313b34}.sub{font:18px system-ui,sans-serif;fill:#555}.label{font:700 18px system-ui,sans-serif;fill:#315f54}.detail{font:17px system-ui,sans-serif;fill:#292a27}.foot{font:15px system-ui,sans-serif;fill:#676}.rule{stroke:#d4a46b;stroke-width:4}</style><rect class="bg" width="960" height="500" rx="20"/><text x="40" y="62" class="title">Choose a hook by the pattern and gauge</text><text x="40" y="102" class="sub">Hook labels are references; the fabric and pattern gauge guide the choice.</text><line x1="40" y1="130" x2="920" y2="130" class="rule"/><rect x="40" y="210" width="280" height="180" rx="18" class="card"/><circle cx="74" cy="248" r="16" class="dot"/><text x="74" y="254" text-anchor="middle" class="num">1</text><text x="100" y="255" class="label">Metric marking</text><text x="62" y="305" class="detail">Compare millimeters</text><text x="62" y="333" class="detail">when labels differ</text><rect x="340" y="210" width="280" height="180" rx="18" class="card"/><circle cx="374" cy="248" r="16" class="dot"/><text x="374" y="254" text-anchor="middle" class="num">2</text><text x="400" y="255" class="label">Letter / number</text><text x="362" y="305" class="detail">Labels can vary by</text><text x="362" y="333" class="detail">size system or maker</text><rect x="640" y="210" width="280" height="180" rx="18" class="card"/><circle cx="674" cy="248" r="16" class="dot"/><text x="674" y="254" text-anchor="middle" class="num">3</text><text x="700" y="255" class="label">Gauge swatch</text><text x="662" y="305" class="detail">Use the project stitch</text><text x="662" y="333" class="detail">and stated dimensions</text><text x="40" y="450" class="foot">Educational reference, not a hook-size conversion chart. Follow the pattern.</text></svg>