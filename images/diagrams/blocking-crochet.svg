<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Blocking a crochet swatch: check fiber care, shape gently to pattern size, and wait until fully dry or cool before unpinning."><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bb7153"/></marker></defs><style>@media(max-width:520px){.stage-label{font-size:31px!important}.svg-heading{font-size:24px!important}}</style><rect width="800" height="600" rx="24" fill="#f7f4ed"/><text class="svg-heading" x="28" y="39" fill="#49534d" font-family="Arial,sans-serif" font-size="21" font-weight="700">VISUAL GUIDE</text><rect x="18" y="53" width="764" height="168" rx="18" fill="#fffdfa" stroke="#e4ded3" stroke-width="2"/><circle cx="48" cy="89" r="19" fill="#e5eee6"/><text x="48" y="95" text-anchor="middle" fill="#55796d" font-family="Arial,sans-serif" font-size="16" font-weight="700">1</text><text class="stage-label" x="78" y="88" fill="#49534d" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="78" dy="0">Check the</tspan><tspan x="78" dy="32">yarn care</tspan><tspan x="78" dy="32">label</tspan></text><path d="M292 103h200v95h-200z" fill="#e7eee8" stroke="#55796d" stroke-width="5" stroke-dasharray="8 6"/><text x="527" y="153" fill="#49534d" font-family="Arial" font-size="17">check fiber care first</text><rect x="18" y="233" width="764" height="168" rx="18" fill="#fffdfa" stroke="#e4ded3" stroke-width="2"/><circle cx="48" cy="269" r="19" fill="#e5eee6"/><text x="48" y="275" text-anchor="middle" fill="#55796d" font-family="Arial,sans-serif" font-size="16" font-weight="700">2</text><text class="stage-label" x="78" y="268" fill="#49534d" font-family="Arial,sans-serif" font-size="20" font-weight="700"><tspan x="78" dy="0">Shape within</tspan><tspan x="78" dy="32">pattern</tspan><tspan x="78" dy="32">dimensions</tspan></text><rect x="297" y="273" wi