<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Choose by the skills the pattern uses</title><desc id="desc">Project size alone does not tell you how many techniques you will need.</desc><style>.bg{fill:#fbf9f4}.card{fill:#fff;stroke:#d8d2c7;stroke-width:2}.dot{fill:#416e60}.num{font:700 17px system-ui,sans-serif;fill:#fff}.title{font:700 30px system-ui,sans-serif;fill:#313b34}.sub{font:18px system-ui,sans-serif;fill:#555}.label{font:700 18px system-ui,sans-serif;fill:#315f54}.detail{font:17px system-ui,sans-serif;fill:#292a27}.foot{font:15px system-ui,sans-serif;fill:#676}.rule{stroke:#d4a46b;stroke-width:4}</style><rect class="bg" width="960" height="500" rx="20"/><text x="40" y="62" class="title">Choose by the skills the pattern uses</text><text x="40" y="102" class="sub">Project size alone does not tell you how many techniques you will need.</text><line x1="40" y1="130" x2="920" y2="130" class="rule"/><rect x="40" y="210" width="280" height="180" rx="18" class="card"/><circle cx="74" cy="248" r="16" class="dot"/><text x="74" y="254" text-anchor="middle" class="num">1</text><text x="100" y="255" class="label">Practice swatch</text><text x="62" y="305" class="detail">Stitch rhythm</text><text x="62" y="333" class="detail">and tension</text><rect x="340" y="210" width="280" height="180" rx="18" class="card"/><circle cx="374" cy="248" r="16" class="dot"/><text x="374" y="254" text-anchor="middle" class="num">2</text><text x="400" y="255" class="label">Flat rectangle</text><text x="362" y="305" class="detail">Rows, turning</text><text x="362" y="333" class="detail">and edge counts</text><rect x="640" y="210" width="280" height="180" rx="18" class="card"/><circle cx="674" cy="248" r="16" class="dot"/><text x="674" y="254" text-anchor="middle" class="num">3</text><text x="700" y="255" class="label">Motif / wearable</text><text x="662" y="305" class="detail">Corners or fit,</text><text x="662" y="333" class="detail">joining and finish</text><text x="40" y="450" class="foot">Read the complete pattern and materials list before choosing.</text></svg>